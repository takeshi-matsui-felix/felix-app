name: Twice a day LINE Notification

on:
  schedule:
    # 毎日 日本時間の 12:00 と 17:00 に自動実行
    - cron: '0 3,8 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run batch script
        run: python batch_notify.py
