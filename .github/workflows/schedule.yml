name: Twice a day LINE Notification

on:
  schedule:
    # 毎日 UTCの 3:00(日本時間12:00) と 11:00(日本時間20:00) に自動実行
    - cron: '0 3,11 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v3
        
      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: まとめ送信プログラムの実行
        run: python batch_notify.py
