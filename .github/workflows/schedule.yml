name: Twice a day LINE Notification

on:
  schedule:
    # 12:00 JST (UTC 3:00)
    - cron: '0 3 * * *'
    # 20:00 JST (UTC 11:00)
    - cron: '0 11 * * *'
    # 22:30 JST (UTC 13:30)
    - cron: '30 13 * * *'
    # 23:00 JST (UTC 14:00) ※念のための予備タイマー
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run batch script
        run: python batch_notify.py
