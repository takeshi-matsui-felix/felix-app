<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📸 FELIX Voice-Cam V4 (学習済み最終版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* カメラ全画面表示 */
        #camera-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }
        
        /* 待機画面（ボタンを押す前） */
        .standby-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; padding: 20px; z-index: 10; background: #1a1a1a; }
        .trigger-btn { background: rgba(222, 255, 154, 0.1); border: 2px dashed #deff9a; border-radius: 15px; padding: 20px; color: #deff9a; font-size: 18px; font-weight: bold; width: 100%; max-width: 400px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .trigger-btn i { font-size: 40px; }

        /* UIオーバーレイ（カメラ起動時） */
        .overlay-ui { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); z-index: 10; display: none; flex-direction: column; align-items: center; }
        
        /* ステータスバッジ */
        .status-badge { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; color: #deff9a; font-size: 14px; font-weight: bold; z-index: 10; display: none; align-items: center; gap: 8px; border: 1px solid #deff9a; }
        .status-badge i { animation: blink 1s infinite; color: red; }
        @keyframes blink { 50% { opacity: 0; } }

        /* テキストエリア */
        textarea { width: 100%; max-width: 400px; height: 100px; padding: 15px; border-radius: 15px; background: rgba(0,0,0,0.7); color: #deff9a; border: 1px solid #555; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; backdrop-filter: blur(5px); }

        /* ボタン群 */
        .action-buttons { display: flex; gap: 15px; width: 100%; max-width: 400px; margin-bottom: 15px; }
        .shutter-btn { flex: 1; background: #deff9a; color: #000; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .clear-btn { background: #333; color: #fff; border: 1px solid #555; padding: 15px; border-radius: 50px; width: 60px; display: flex; align-items: center; justify-content: center; }
        
        .complete-btn { width: 100%; max-width: 400px; background: #4a90e2; color: #fff; border: none; padding: 15px; border-radius: 15px; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: env(safe-area-inset-bottom, 20px); }

        #photo-preview { position: absolute; top: 70px; right: 20px; width: 80px; height: 120px; border-radius: 10px; border: 2px solid #deff9a; object-fit: cover; z-index: 10; display: none; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="standby-screen" id="standby">
        <h3 style="color:#aaa; font-size:16px; margin-bottom:30px;">JACK港区正保8 / 中間検査 (テスト)</h3>
        <div class="trigger-btn" id="startBtn">
            <i class="fa-solid fa-microphone-lines"></i>
            <span>🎤 音声カメラを起動して瞬時に入力</span>
        </div>
        <p style="color:#666; font-size:12px; margin-top:20px; text-align:center;">※過去の検査データを学習済み</p>
    </div>

    <video id="camera-view" autoplay playsinline></video>
    <div class="status-badge" id="status"><i class="fa-solid fa-circle"></i> 録音＆AI解析中...</div>
    <img id="photo-preview" />
    <canvas id="canvas"></canvas>

    <div class="overlay-ui" id="overlay">
        <textarea id="output" placeholder="喋った言葉が自動で学習辞書を通ってここに表示されます..."></textarea>
        
        <div class="action-buttons">
            <button class="shutter-btn" id="captureBtn"><i class="fa-solid fa-camera"></i> 撮影</button>
            <button class="clear-btn" id="clearBtn"><i class="fa-solid fa-trash"></i></button>
        </div>
        
        <button class="complete-btn" id="completeBtn">✅ 仮）登録完了して戻る</button>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const clearBtn = document.getElementById('clearBtn');
        const completeBtn = document.getElementById('completeBtn');
        const video = document.getElementById('camera-view');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const standby = document.getElementById('standby');
        const overlay = document.getElementById('overlay');
        const photoPreview = document.getElementById('photo-preview');
        const canvas = document.getElementById('canvas');

        let recognition;
        let isStarted = false;

        // 🧠 FELIX過去データ学習済み マスター語彙リスト（数千語から高頻度なものを抽出）
        const masterVocabulary = [
            "見切り", "シューズボックス", "コーキング", "ボンドコーク", "丁番", "レバーハンドル", 
            "戸当たり", "巾木", "フロアタイル", "ダクト", "PB", "キッチンパネル", 
            "掃き出しサッシ", "軒天", "サイディング", "エアコンドレン", "引き戸", "建付け", 
            "小口処理", "枕棚", "雑巾ずり", "ソフトクローズ", "土台水切り", "土間コンクリート", 
            "伸縮目地", "砕石", "浸透マス", "定着", "人通口", "補強筋", "重ね継手", 
            "スラブ筋", "防湿フィルム", "ホールダウン金物", "大引き", "石膏ボード", 
            "竪穴区画", "プラシール", "界壁", "防振根太", "音ナイン", "ウレタン", "コの字"
        ];

        // 🧮 数学アルゴリズム
        function getSimilarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            let costs = new Array();
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i === 0) costs[j] = j;
                    else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (longer.charAt(i - 1) !== shorter.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }
            return (longerLength - costs[shorter.length]) / parseFloat(longerLength);
        }

        // 🔍 自動補正機能
        function autoCorrect(text) {
            let correctedText = text;
            
            // ★超強力：音声誤変換の強制マッピング辞書
            const phoneticDictionary = {
                "陣痛行": "人通口", "陣痛候": "人通口", "陣痛": "人通口",
                "言う事項": "U字溝", "言う事こう": "U字溝", "U事項": "U字溝",
                "ようぜせい": "要是正", "要是正": "要是正",
                "このじ": "コの字",
                "かねがでていない": "矩が出ていない", "金が出ていない": "矩が出ていない",
                "ばちっている": "バチっている", "罰っている": "バチっている",
                "のきてん": "軒天", "楽天": "軒天",
                "はばき": "巾木", "葉巻": "巾木",
                "ピービー": "PB", "シーエル": "CL",
                "ぞうきんずり": "雑巾ずり",
                "なみだめ": "涙目設置",
                "たてつけ": "建付け",
                "たてあなくかく": "竪穴区画"
            };

            // まず強制マッピングを通す
            for (let key in phoneticDictionary) {
                let regex = new RegExp(key, "g");
                correctedText = correctedText.replace(regex, phoneticDictionary[key]);
            }

            // 次にマスター語彙とファジィ検索（タイポ・揺れ吸収）
            masterVocabulary.forEach(word => {
                let windowSize = word.length;
                for (let i = 0; i <= correctedText.length - windowSize; i++) {
                    let chunk = correctedText.substring(i, i + windowSize);
                    let similarity = getSimilarity(chunk, word);
                    if (similarity >= 0.60 && similarity < 1.0) {
                        correctedText = correctedText.substring(0, i) + word + correctedText.substring(i + windowSize);
                    }
                }
            });
            
            return correctedText;
        }

        // カメラと音声の起動
        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("非対応ブラウザです"); return; }
                
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onresult = (event) => {
                    let text = "";
                    for (let i = 0; i < event.results.length; i++) {
                        text += event.results[i][0].transcript;
                    }
                    // AIエンジンを通す
                    output.value = autoCorrect(text);
                };

                recognition.onend = () => {
                    if (isStarted) recognition.start();
                };

                isStarted = true;
                recognition.start();
                
                // UI切り替え
                standby.style.display = "none";
                video.style.display = "block";
                overlay.style.display = "flex";
                status.style.display = "flex";
                
            } catch (e) {
                alert("カメラの起動に失敗しました。");
            }
        };

        // 撮影処理
        captureBtn.onclick = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoPreview.src = canvas.toDataURL('image/jpeg');
            photoPreview.style.display = "block";
            
            // 撮影アクション
            captureBtn.style.background = "#fff";
            setTimeout(() => captureBtn.style.background = "#deff9a", 100);
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        };

        // クリア処理
        clearBtn.onclick = () => { output.value = ""; };

        // 完了して戻る処理（テスト版）
        completeBtn.onclick = () => {
            if(!output.value) {
                alert("テキストが入力されていません！");
                return;
            }
            alert(`【連携成功テスト】\n以下のデータが元の画面に転送されます。\n\nテキスト: ${output.value}\n写真: ${photoPreview.src ? '撮影済み' : 'なし'}\n\n※実際のアプリではここで元の画面にスッと戻ります。`);
            
            // リセット
            isStarted = false;
            recognition.stop();
            video.srcObject.getTracks().forEach(track => track.stop());
            
            standby.style.display = "flex";
            video.style.display = "none";
            overlay.style.display = "none";
            status.style.display = "none";
            photoPreview.style.display = "none";
            output.value = "";
        };
    </script>
</body>
</html>
