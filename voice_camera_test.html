<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📸 FELIX Voice-Cam V3 (AI Engine)</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .video-container { width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; position: relative; border: 2px solid #deff9a; }
        video { width: 100%; display: block; }
        .status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; color: #deff9a; font-size: 14px; }
        .controls { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 400px; }
        button { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        #startBtn { background: #deff9a; color: #000; }
        #captureBtn { background: #4a90e2; color: #fff; display: none; }
        #clearBtn { background: #ff6b6b; color: #fff; margin-top: 10px; width: 100%; max-width: 400px; display: none; }
        textarea { width: 100%; max-width: 400px; height: 120px; margin-top: 15px; padding: 10px; border-radius: 10px; background: #222; color: #deff9a; border: 1px solid #555; font-size: 18px; box-sizing: border-box; }
        #photoResult { width: 100%; max-width: 400px; margin-top: 15px; border-radius: 15px; border: 2px solid #deff9a; display: none; }
    </style>
</head>
<body>
    <h2 style="color: #deff9a; margin-top:0;">📸 Voice-Cam V3<br><span style="font-size:12px; color:#aaa;">(ファジィ検索エンジン搭載)</span></h2>
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="status" class="status">停止中</div>
    </div>
    
    <div class="controls">
        <button id="startBtn">▶️ 開始（カメラ＆マイク）</button>
        <button id="captureBtn">📸 撮影（パシャッ）</button>
    </div>
    
    <textarea id="output" placeholder="喋った言葉が自動補正されて表示されます..."></textarea>
    <button id="clearBtn">🗑️ テキストを消してやり直す</button>

    <img id="photoResult" />
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const clearBtn = document.getElementById('clearBtn');
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const photoResult = document.getElementById('photoResult');
        const canvas = document.getElementById('canvas');

        let recognition;
        let isStarted = false;

        // 🧠 FELIX専用 マスター語彙リスト（ステップ1でここを自動生成します）
        const masterVocabulary = [
            "人通口", "U字溝", "要是正", "ビス浮き", "合板", "補強筋"
        ];

        // 🧮 レーベンシュタイン距離（文字の類似度）を計算するアルゴリズム
        function getSimilarity(s1, s2) {
            let longer = s1; let shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            
            let costs = new Array();
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (longer.charAt(i - 1) !== shorter.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }
            return (longerLength - costs[shorter.length]) / parseFloat(longerLength);
        }

        // 🔍 音声テキストをマスター語彙リストと照合して自動補正する機能
        function autoCorrect(text) {
            let correctedText = text;
            
            // 例: 3文字〜5文字の塊でスキャンして、似ている言葉があれば置き換える
            masterVocabulary.forEach(word => {
                // 文字数が同じくらいの誤変換を探す（簡易的なスライディングウィンドウ）
                let windowSize = word.length;
                for (let i = 0; i <= correctedText.length - windowSize; i++) {
                    let chunk = correctedText.substring(i, i + windowSize);
                    let similarity = getSimilarity(chunk, word);
                    
                    // 類似度が60%以上なら自動的に書き換える（例: U事項(3文字) vs U字溝(3文字) -> 66%一致）
                    if (similarity >= 0.60 && similarity < 1.0) {
                        correctedText = correctedText.substring(0, i) + word + correctedText.substring(i + windowSize);
                    }
                }
            });
            
            // 漢字の全く違う誤変換（陣痛行など）は、私が自動生成するマッピング辞書でカバーします
            correctedText = correctedText.replace(/陣痛行|陣痛候|陣痛/g, "人通口");
            
            return correctedText;
        }

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("非対応ブラウザです"); return; }
                
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    status.innerText = "🎙️ 音声認識中...";
                    status.style.color = "#deff9a";
                };

                recognition.onresult = (event) => {
                    let text = "";
                    for (let i = 0; i < event.results.length; i++) {
                        text += event.results[i][0].transcript;
                    }
                    // 🛠️ 取得したテキストを自動補正エンジンにかける
                    output.value = autoCorrect(text);
                };

                recognition.onend = () => {
                    if (isStarted) recognition.start();
                };

                isStarted = true;
                recognition.start();
                startBtn.style.display = "none";
                captureBtn.style.display = "block";
                clearBtn.style.display = "block";
            } catch (e) {
                alert("起動失敗: " + e);
            }
        };

        captureBtn.onclick = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoResult.src = canvas.toDataURL('image/jpeg');
            photoResult.style.display = "block";
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        };

        clearBtn.onclick = () => {
            output.value = "";
        };
    </script>
</body>
</html>
