<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📸 FELIX Voice-Cam V2</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .video-container { width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; position: relative; border: 2px solid #deff9a; }
        video { width: 100%; display: block; }
        .status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; color: #deff9a; font-size: 14px; }
        .controls { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 400px; }
        button { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        #startBtn { background: #deff9a; color: #000; }
        #captureBtn { background: #4a90e2; color: #fff; display: none; }
        #clearBtn { background: #ff6b6b; color: #fff; margin-top: 10px; width: 100%; max-width: 400px; display: none; }
        textarea { width: 100%; max-width: 400px; height: 120px; margin-top: 15px; padding: 10px; border-radius: 10px; background: #222; color: #deff9a; border: 1px solid #555; font-size: 18px; box-sizing: border-box; }
        #photoResult { width: 100%; max-width: 400px; margin-top: 15px; border-radius: 15px; border: 2px solid #deff9a; display: none; }
    </style>
</head>
<body>
    <h2 style="color: #deff9a; margin-top:0;">📸 Voice-Cam V2</h2>
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="status" class="status">停止中</div>
    </div>
    
    <div class="controls">
        <button id="startBtn">▶️ 開始（カメラ＆マイク）</button>
        <button id="captureBtn">📸 撮影（パシャッ）</button>
    </div>
    
    <textarea id="output" placeholder="喋った言葉がここに表示されます... (タップして手修正も可能)"></textarea>
    <button id="clearBtn">🗑️ テキストを消してやり直す</button>

    <img id="photoResult" />
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const clearBtn = document.getElementById('clearBtn');
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const photoResult = document.getElementById('photoResult');
        const canvas = document.getElementById('canvas');

        let recognition;
        let isStarted = false;

        // 🛠️ FELIX専用 自動変換辞書（ここをどんどん増やせば最強になります！）
        const dictionary = {
            "ようぜせい": "要是正",
            "このじ": "コの字",
            "じんつうこう": "人通口",
            "ビスうき": "ビス浮き",
            "ごうはん": "合板"
        };

        // 辞書を使ってテキストを置き換える関数
        function applyDictionary(text) {
            let newText = text;
            for (let key in dictionary) {
                // 音声認識の揺れに対応するため、単純な文字列置換を行う
                newText = newText.split(key).join(dictionary[key]);
            }
            return newText;
        }

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("非対応ブラウザです"); return; }
                
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    status.innerText = "🎙️ 音声認識中...";
                    status.style.color = "#deff9a";
                };

                recognition.onresult = (event) => {
                    let text = "";
                    for (let i = 0; i < event.results.length; i++) {
                        text += event.results[i][0].transcript;
                    }
                    // 辞書フィルターを通してテキストエリアに表示
                    output.value = applyDictionary(text);
                };

                recognition.onend = () => {
                    if (isStarted) recognition.start();
                };

                isStarted = true;
                recognition.start();
                startBtn.style.display = "none";
                captureBtn.style.display = "block";
                clearBtn.style.display = "block";
            } catch (e) {
                alert("起動失敗: " + e);
            }
        };

        captureBtn.onclick = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoResult.src = canvas.toDataURL('image/jpeg');
            photoResult.style.display = "block";
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        };

        // クリアボタンの処理
        clearBtn.onclick = () => {
            output.value = ""; // テキストを空にする
        };
    </script>
</body>
</html>
